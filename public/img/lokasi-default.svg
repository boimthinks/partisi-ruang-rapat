<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1428" />
      <stop offset="50%" stop-color="#070e1e" />
      <stop offset="100%" stop-color="#050a16" />
    </linearGradient>

    <!-- Accent Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0077ff" stop-opacity="0.8" />
    </linearGradient>

    <!-- Pin Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Blueprint Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.07" />
    </pattern>
    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#00e5ff" fill-opacity="0.12" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="600" fill="url(#bgGrad)" />

  <!-- Technical Grids -->
  <rect width="800" height="600" fill="url(#grid)" />
  <rect width="800" height="600" fill="url(#dotGrid)" />

  <!-- Decorative Corner Brackets (Blueprint Style) -->
  <path d="M 30 50 L 30 30 L 50 30" fill="none" stroke="#00e5ff" stroke-width="2" stroke-opacity="0.5" />
  <path d="M 770 50 L 770 30 L 750 30" fill="none" stroke="#00e5ff" stroke-width="2" stroke-opacity="0.5" />
  <path d="M 30 550 L 30 570 L 50 570" fill="none" stroke="#00e5ff" stroke-width="2" stroke-opacity="0.5" />
  <path d="M 770 550 L 770 570 L 750 570" fill="none" stroke="#00e5ff" stroke-width="2" stroke-opacity="0.5" />

  <!-- City Skyline Architectural Silhouette -->
  <g fill="#0e1a32" fill-opacity="0.6">
    <!-- Buildings Left -->
    <rect x="70" y="360" width="55" height="160" rx="2" />
    <rect x="135" y="320" width="70" height="200" rx="2" />
    <rect x="215" y="280" width="60" height="240" rx="2" />
    <rect x="285" y="340" width="75" height="180" rx="2" />
    <!-- Center Silhouette (Behind Badge) -->
    <rect x="370" y="250" width="60" height="270" rx="2" />
    <!-- Buildings Right -->
    <rect x="440" y="310" width="70" height="210" rx="2" />
    <rect x="520" y="270" width="65" height="250" rx="2" />
    <rect x="595" y="330" width="75" height="190" rx="2" />
    <rect x="680" y="370" width="55" height="150" rx="2" />
  </g>

  <!-- Horizon Line -->
  <line x1="40" y1="520" x2="760" y2="520" stroke="#00e5ff" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="6 4" />

  <!-- Center Pin & Radar Waves -->
  <circle cx="400" cy="240" r="110" fill="none" stroke="#00e5ff" stroke-opacity="0.1" stroke-width="1.5" />
  <circle cx="400" cy="240" r="80" fill="none" stroke="#00e5ff" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="4 4" />
  <circle cx="400" cy="240" r="50" fill="#00e5ff" fill-opacity="0.08" />

  <!-- Map Pin Icon -->
  <g filter="url(#glow)">
    <path d="M 400 180 C 378 180 360 198 360 220 C 360 248 393 283 397 287 C 398.5 289 401.5 289 403 287 C 407 283 440 248 440 220 C 440 198 422 180 400 180 Z" fill="url(#cyanGrad)" />
    <circle cx="400" cy="220" r="14" fill="#070e1e" />
    <circle cx="400" cy="220" r="6" fill="#00e5ff" />
  </g>

  <!-- Ground Reflection / Shadow -->
  <ellipse cx="400" cy="305" rx="35" ry="6" fill="#00e5ff" fill-opacity="0.25" />

  <!-- Central Badge / Typography Overlay -->
  <rect x="180" y="370" width="440" height="100" rx="12" fill="#0a1428" fill-opacity="0.92" stroke="#00e5ff" stroke-opacity="0.4" stroke-width="1" />
  
  <text x="400" y="405" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#00e5ff" letter-spacing="3" text-transform="uppercase">
    LAYANAN &amp; INSTALASI RESMI PIREKI
  </text>
  
  <text x="400" y="435" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="1">
    Partisi Ruang Rapat &amp; Akustik
  </text>

  <text x="400" y="456" text-anchor="middle" font-family="monospace" font-size="11" fill="#94a3b8" letter-spacing="1.5">
    SURVEI LOKASI • PABRIKASI MANDIRI • GARANSI RESMI
  </text>

  <!-- Technical Spec Watermark Footer -->
  <text x="50" y="555" font-family="monospace" font-size="10" fill="#64748b" letter-spacing="1">
    SYS: 4:3 GEOGRAPHIC COVERAGE • CV PIREKI ASIA
  </text>
  <text x="750" y="555" text-anchor="end" font-family="monospace" font-size="10" fill="#00e5ff" fill-opacity="0.7" letter-spacing="1">
    EST. 2008 • INDONESIA
  </text>
</svg>
